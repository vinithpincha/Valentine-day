<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fce4ec;
    text-align: center;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
  }

  .active {
    display: flex;
  }

  h1 {
    color: #d81b60;
    font-size: 2.1rem;
    padding: 0 16px;
  }

  img {
    border-radius: 12px;
  }

  /* Page 1 */
  #intro img {
    max-width: 260px;
    margin-bottom: 20px;
  }

  /* Buttons */
  button {
    padding: 14px 28px;
    font-size: 1.3rem;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  #yesBtn {
    background-color: #e91e63;
    color: white;
  }

  #noBtn {
    background-color: white;
    color: #e91e63;
    border: 2px solid #e91e63;
    position: absolute;
    pointer-events: none; /* cannot click */
  }

  /* Page 2 images */
  #gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 16px;
  }

  #gallery img {
    width: 140px;
    height: 140px;
    object-fit: cover;
    opacity: 0;
    animation: fadeIn 0.5s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="intro" class="screen active">
  <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWk5OW5tMGx6dHRiYnM3cWxpMWd2YXhnbGFqczh2Y3B1OXV2dHlydCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wvYNSqBAMDVx8CEYkt/giphy.gif" alt="Cute bear">

  <h1 id="question">Hi Dad 💙, will you be my Valentine?</h1>

  <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
  <button id="noBtn">No 🙃</button>
</div>

<!-- PAGE 2 -->
<div id="memories" class="screen">
  <h1>YAY!!! Happy Valentine’s Day 💖💖💖</h1>
  <div id="gallery"></div>
</div>

<!-- Music -->
<audio id="bgMusic" loop preload="auto">
  <source src="music/subhanallah.mp3" type="audio/mpeg">
</audio>

<!-- Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* -------- Name rotation -------- */
const names = ["Dad 💙", "Mom 💕", "Shubhi 🌸"];
let nameIndex = 0;

setInterval(() => {
    document.getElementById("question").innerText =
    `Hi ${names[nameIndex]}, will you be my Valentine?`;
    nameIndex = (nameIndex + 1) % names.length;
}, 500);

/* -------- No button proximity movement -------- */
const noBtn = document.getElementById("noBtn");

document.addEventListener("mousemove", (e) => {
  const rect = noBtn.getBoundingClientRect();
  const distX = Math.abs(e.clientX - rect.left);
  const distY = Math.abs(e.clientY - rect.top);

  if (distX < 100 && distY < 100) moveNo();
});

document.addEventListener("touchstart", moveNo);

function moveNo() {
  const maxX = window.innerWidth - 120;
  const maxY = window.innerHeight - 120;
  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
}

/* -------- Yes click -------- */
function sayYes() {
  document.getElementById("intro").classList.remove("active");
  document.getElementById("memories").classList.add("active");

  document.getElementById("bgMusic").play();

  confetti({
    particleCount: 200,
    spread: 90,
    origin: { y: 0.6 }
  });

  startGallery();
}

/* -------- Progressive gallery (10 images stay visible) -------- */
const images = [
  "images/img1.jpg",
  "images/img2.jpg",
  "images/img3.jpg",
  "images/img4.jpg",
  "images/img5.jpg",
  "images/img6.jpg",
  "images/img7.jpg",
  "images/img8.jpg",
  "images/img9.jpg",
  "images/img10.jpg"
];

let galleryIndex = 0;
const gallery = document.getElementById("gallery");

function startGallery() {
  const interval = setInterval(() => {
    if (galleryIndex >= images.length) {
      clearInterval(interval);
      return;
    }

    const img = document.createElement("img");
    img.src = images[galleryIndex];
    gallery.appendChild(img);

    galleryIndex++;
  }, 2200);
}
</script>

</body>
</html>
