<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fce4ec;
    text-align: center;
    min-height: 100vh;
    margin: 0;
    overflow-x: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .screen {
    display: none;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  .active {
    display: flex;
  }

  h1 {
    color: #d81b60;
    font-size: 2rem;
    padding: 0 16px;
  }

  /* ---------- PAGE 1 ---------- */
  #intro img {
    max-width: 260px;
    border-radius: 12px;
    margin-bottom: 20px;
  }

  button {
    padding: 14px 28px;
    font-size: 1.3rem;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  #yesBtn {
    background-color: #e91e63;
    color: white;
  }

  #noBtn {
    background-color: white;
    color: #e91e63;
    border: 2px solid #e91e63;
    position: absolute;
    pointer-events: none;
    left: 55%;
    top: 65%;
  }

  /* ---------- PAGE 2 ---------- */
  #memories {
    max-height: 100vh;
    overflow-y: auto;
    padding-bottom: 40px;
    -webkit-overflow-scrolling: touch;
  }

  #gallery {
    display: flex;
    flex-direction: column;   /* 👈 one image per row */
    align-items: center;
    gap: 16px;
    padding: 16px;
    width: 100%;
  }

  #gallery img {
    width: 90%;
    max-width: 320px;
    border-radius: 14px;
    opacity: 0;
    animation: fadeIn 0.5s forwards;
  }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="intro" class="screen active">
  <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExcWk5OW5tMGx6dHRiYnM3cWxpMWd2YXhnbGFqczh2Y3B1OXV2dHlydCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wvYNSqBAMDVx8CEYkt/giphy.gif" alt="Cute bear">

  <h1 id="question">Hi Dad 💙, will you be my Valentine?</h1>

  <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
  <button id="noBtn">No 🙃</button>
</div>

<!-- PAGE 2 -->
<div id="memories" class="screen">
  <h1>YAY!!! Happy Valentine’s Day 💖💖💖</h1>
  <div id="gallery"></div>
</div>

<!-- 🎵 Music -->
<audio id="bgMusic" loop preload="auto">
  <source src="music/subhanallah.mp3" type="audio/mpeg">
</audio>

<!-- 🎉 Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* ---------- Name rotation ---------- */
const names = ["Dad 💙", "Mom 💕", "Shubhi 🌸"];
let nameIndex = 0;

setInterval(() => {
    document.getElementById("question").innerText =
    `Hi ${names[nameIndex]}, will you be my Valentine?`;
    nameIndex = (nameIndex + 1) % names.length;
}, 500);

/* ---------- No button proximity escape ---------- */
const noBtn = document.getElementById("noBtn");

document.addEventListener("mousemove", (e) => {
  const r = noBtn.getBoundingClientRect();
  if (Math.abs(e.clientX - r.left) < 100 && Math.abs(e.clientY - r.top) < 100) {
    moveNo();
  }
});

document.addEventListener("touchstart", moveNo);

function moveNo() {
  noBtn.style.left = Math.random() * (window.innerWidth - 120) + "px";
  noBtn.style.top  = Math.random() * (window.innerHeight - 120) + "px";
}

/* ---------- Yes click ---------- */
function sayYes() {
  document.getElementById("intro").classList.remove("active");
  document.getElementById("memories").classList.add("active");

  document.getElementById("bgMusic").play();

  confetti({
    particleCount: 200,
    spread: 90,
    origin: { y: 0.6 }
  });

  startGallery();
}

/* ---------- Progressive gallery + gentle auto-scroll ---------- */
const images = [
  "images/img1.jpg",
  "images/img2.jpg",
  "images/img3.jpg",
  "images/img4.jpg",
  "images/img5.jpg",
  "images/img6.jpg",
  "images/img7.jpg",
  "images/img8.jpg",
  "images/img9.jpg",
  "images/img10.jpg"
];

let galleryIndex = 0;
const gallery = document.getElementById("gallery");

function startGallery() {
  const interval = setInterval(() => {
    if (galleryIndex >= images.length) {
      clearInterval(interval);
      return;
    }

    const img = document.createElement("img");
    img.src = images[galleryIndex];
    gallery.appendChild(img);

    // 👇 Gentle auto-scroll (Option A)
    setTimeout(() => {
      img.scrollIntoView({ behavior: "smooth", block: "end" });
    }, 100);

    galleryIndex++;
  }, 2200);
}
</script>

</body>
</html>
