<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine?</title>

<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fce4ec;
    text-align: center;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }

  h1 {
    color: #d81b60;
    font-size: 2.1rem;
    padding: 0 16px;
  }

  #slideshow {
    max-width: 240px;
    border-radius: 12px;
    margin-bottom: 20px;
    transition: opacity 0.4s ease-in-out;
  }

  .buttons {
    margin-top: 20px;
  }

  button {
    padding: 14px 28px;
    font-size: 1.3rem;
    margin: 10px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }

  #yesBtn {
    background-color: #e91e63;
    color: white;
  }

  #noBtn {
    background-color: white;
    color: #e91e63;
    border: 2px solid #e91e63;
    position: absolute;
  }
</style>
</head>

<body>

<img id="slideshow" src="images/img1.jpg" alt="Memories">

<h1 id="question">Hi Dad 💙, will you be my Valentine?</h1>

<div class="buttons">
  <button id="yesBtn" onclick="sayYes()">Yes 💖</button>
  <button id="noBtn" onclick="moveButton()" ontouchstart="moveButton()">No 🙃</button>
</div>

<!-- 🎵 Local music from repo -->
<audio id="bgMusic" loop preload="auto">
  <source src="music/subhanallah.mp3" type="audio/mpeg">
</audio>

<!-- 🎉 Confetti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
/* ---------- Instant name rotation ---------- */
const names = ["Dad 💙", "Mom 💕", "Shubhi 🌸"];
let nameIndex = 0;

function rotateNamesInstant() {
  if (nameIndex < names.length) {
    document.getElementById("question").innerText =
      `Hi ${names[nameIndex]}, will you be my Valentine?`;
    nameIndex++;
    setTimeout(rotateNamesInstant, 400);
  }
}
rotateNamesInstant();

/* ---------- Image slideshow (10 images) ---------- */
const images = [
  "images/img1.jpg",
  "images/img2.jpg",
  "images/img3.jpg",
  "images/img4.jpg",
  "images/img5.jpg",
  "images/img6.jpg",
  "images/img7.jpg",
  "images/img8.jpg",
  "images/img9.jpg",
  "images/img10.jpg"
];

let imgIndex = 0;
const slide = document.getElementById("slideshow");

setInterval(() => {
  imgIndex = (imgIndex + 1) % images.length;
  slide.style.opacity = 0;

  setTimeout(() => {
    slide.src = images[imgIndex];
    slide.style.opacity = 1;
  }, 300);
}, 2300);

/* ---------- No button chaos ---------- */
let moves = 0;
function moveButton() {
  moves++;
  const btn = document.getElementById("noBtn");

  const maxX = window.innerWidth - 120;
  const maxY = window.innerHeight - 120;

  btn.style.left = Math.random() * maxX + "px";
  btn.style.top = Math.random() * maxY + "px";

  if (moves > 6) btn.style.transform = "scale(0.8)";
  if (moves > 10) btn.style.display = "none";
}

/* ---------- Yes click ---------- */
function sayYes() {
  document.getElementById("question").innerText =
    "YAY!!! Happy Valentine’s Day 💖💖💖";

  document.getElementById("yesBtn").style.display = "none";
  document.getElementById("noBtn").style.display = "none";

  // 🎵 Play music (mobile-safe)
  document.getElementById("bgMusic").play();

  // 🎉 Confetti
  confetti({
    particleCount: 200,
    spread: 90,
    origin: { y: 0.6 }
  });
}
</script>

</body>
</html>
